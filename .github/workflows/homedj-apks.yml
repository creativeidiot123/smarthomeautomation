name: HomeDJ APKs
on:
  pull_request:
    paths:
      - '.github/workflows/homedj-apks.yml'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'shared/**'
      - 'server/**'
      - 'controller/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Unit test and build both APKs
        run: gradle --no-daemon --console=plain :shared:test :server:assembleDebug :controller:assembleDebug
      - name: Upload separate debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: homedj-phase1-debug-apks
          path: |
            server/build/outputs/apk/debug/*.apk
            controller/build/outputs/apk/debug/*.apk
          if-no-files-found: error
